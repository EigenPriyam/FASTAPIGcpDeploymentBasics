[project]
name = "gcpbasicdeployment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yash", email = "agrawalpriyam39@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

